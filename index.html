<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Vanilla JS - Contact book</title>
</head>
<body>

    <div class="box-navbar">
        <div class="menu-navbar">
            <button id="register-contact">Cadastrar Contato</button>
        </div>
    </div>

    <div class="box-modal hidden">
        <form action="" id="formModal" novalidate>
            <div class="inputs">
                <button type="button" class="closed-modal" aria-label="Fechar">X</button>
                <p><label>Nome: <input type="text" class="name" required></label></p>
                <p><label>Email: <input type="email" class="email" required></label></p>
                <p><label>Telefone: <input type="tel" class="telphone" required></label></p>
                <p><label>Profissão: <input type="text" class="job"></label></p>
                <p><label>Empresa: <input type="text" class="enterprise"></label></p>
                <p><label>CEP: <input type="text" class="cep" inputmode="numeric" maxlength="9"></label> <small class="cep-status" aria-live="polite"></small></p>
                <p><label>Cidade: <input type="text" class="city"></label></p>
                <p><label>Estado: <input type="text" class="state"></label></p>
                <p><label>Data de Nascimento: <input type="date" class="datebirth"></label></p>
                <p><label>Observações: <input type="text" class="observation"></label></p>
                <p class="form-error" aria-live="polite"></p>
                <button id="data-send">Enviar dados</button>
            </div>
        </form>
    </div>

    <div class="box-container">
        <div class="title">
            Seja bem vindo - Contact book
        </div>

        <div class="list-items">
            <input type="search" class="search" placeholder="Buscar contato..." aria-label="Buscar contato">
            <table class="table-full">
                <thead>
                    <tr>
                    <th>Nome Completo</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Profissão</th>
                    <th>Empresa</th>
                    <th>CEP</th>
                    <th>Cidade</th>
                    <th>Estado</th>
                    <th>Data de Nascimento</th>
                    <th>Observações</th>
                    <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
